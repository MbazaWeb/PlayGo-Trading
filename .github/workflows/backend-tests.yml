name: Backend unit tests
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run isolated unit tests
        working-directory: backend
        env:
          PLAYGO_ENV: local
        run: python -m unittest discover -p 'test_*.py' -v

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playgo_test
          POSTGRES_PASSWORD: playgo_test_only
          POSTGRES_DB: playgo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playgo_test -d playgo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://playgo_test:playgo_test_only@127.0.0.1:5432/playgo_ci
      PLAYGO_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Apply private PostgreSQL schema to disposable CI database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          root = Path("backend/sql")
          with psycopg.connect(os.environ["TEST_DATABASE_URL"]) as conn:
              for name in ("supabase_foundation.sql", "supabase_owner_identity.sql", "supabase_accounting_integrity.sql"):
                  conn.execute((root / name).read_text())
          PY
      - name: Run real PostgreSQL integration tests
        working-directory: backend
        run: python -m unittest test_postgres_integration -v
